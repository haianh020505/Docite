version: "3.9"

services:
  # ─────────────────────────────────────────────
  # Database (PostgreSQL + pgvector)
  # Start with: docker compose up db -d
  # ─────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: docite
      POSTGRES_PASSWORD: docite
      POSTGRES_DB: docite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docite"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # API backend (uncomment when Dockerfile is ready)
  # ─────────────────────────────────────────────
  # api:
  #   build:
  #     context: ../apps/api
  #     dockerfile: Dockerfile
  #   env_file: ../apps/api/.env
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     db:
  #       condition: service_healthy

  # ─────────────────────────────────────────────
  # Web frontend (uncomment when Dockerfile is ready)
  # ─────────────────────────────────────────────
  # web:
  #   build:
  #     context: ../apps/web
  #     dockerfile: Dockerfile
  #   ports:
  #     - "5173:80"
  #   depends_on:
  #     - api

volumes:
  pgdata:
