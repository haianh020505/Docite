name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: Frontend — lint, typecheck, build
  # ────────────────────────────────────────────────────────────
  web:
    name: Web (lint · typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ────────────────────────────────────────────────────────────
  # Job 2: API — ruff, pytest
  # ────────────────────────────────────────────────────────────
  api:
    name: API (ruff · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ai package
        run: pip install -e ../../ai
        working-directory: apps/api

      - name: Install api package + dev deps
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        run: pytest tests/ -v

  # ────────────────────────────────────────────────────────────
  # Job 3: AI — ruff, pytest
  # ────────────────────────────────────────────────────────────
  ai:
    name: AI (ruff · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ai package + dev deps
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/

      - name: Pytest
        run: pytest tests/ -v
